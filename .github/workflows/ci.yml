name: Cshll CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3

      - name: Build shell2c
        run: make clean && make

      - name: Run test_stress (S01-S50)
        run: bash tests/test_stress.sh

      - name: Run regression tests (REG-01..REG-07)
        run: bash tests/regression_2026_08.sh

      - name: Run syntax coverage matrix (27 features)
        run: bash tests/run_syntax_tests.sh

      - name: Run e2e diff tests
        run: |
          for t in tests/test1.sh tests/test2.sh tests/test3.sh tests/test4.sh \
                   tests/test5.sh tests/test6.sh tests/twopipe.sh tests/test_hd.sh \
                   tests/test_newfeat.sh tests/test_compat.sh tests/test_complex.sh \
                   tests/test_patterns.sh; do
            ./shell2c "$t" "${t%.sh}.c" || exit 1
            gcc -O2 -w -o "${t%.sh}" "${t%.sh}.c" || exit 1
            diff <(bash "$t" 2>&1) <("./${t%.sh}" 2>&1) || { echo "FAILED: $t"; exit 1; }
            echo "PASS: $t"
          done

      - name: Run test_stress2 (S51-S100)
        run: bash tests/test_stress2.sh

      - name: Run test_stress3 (S101-S150)
        run: bash tests/test_stress3.sh

      - name: Run test_deep_audit (D001-D050)
        run: bash tests/test_deep_audit.sh

      - name: Build with AddressSanitizer + LeakSanitizer (transpiler)
        run: |
          gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Wall -Isrc -I. -o shell2c_asan \
              shell2c.c src/s2c_obfuscate.c src/s2c_mangle.c \
              src/s2c_vm_runtime.c src/s2c_vm_bridge.c -lpthread

      - name: ASAN: run transpiler over all test scripts
        run: |
          for t in tests/test1.sh tests/test2.sh tests/test3.sh tests/test4.sh \
                   tests/test5.sh tests/test6.sh tests/twopipe.sh tests/test_hd.sh \
                   tests/test_newfeat.sh tests/test_compat.sh tests/test_complex.sh \
                   tests/test_patterns.sh tests/regression_2026_08.sh; do
            ASAN_OPTIONS=detect_leaks=1 ./shell2c_asan "$t" /tmp/asan_out.c || exit 1
          done
          echo "ASAN clean"

      - name: Run boundary tests
        run: |
          cd tests/boundary
          for t in b1_empty_special.sh b3_arith_boundary.sh b4_array_boundary.sh b5_control_flow.sh; do
            bash "$t" > /tmp/bash_$t.out 2>&1
            ../../shell2c "$t" /tmp/${t%.sh}.c 2>/dev/null
            gcc -O2 -o /tmp/${t%.sh} /tmp/${t%.sh}.c 2>/dev/null
            /tmp/${t%.sh} > /tmp/s2c_$t.out 2>&1
            diff /tmp/bash_$t.out /tmp/s2c_$t.out || exit 1
          done

      - name: LLVM-VM security check
        run: |
          cat > /tmp/secret_test.sh << 'SCRIPT'
          echo "test ok"
          x=$((1+2))
          echo "x=$x"
          SCRIPT
          ./shell2c /tmp/secret_test.sh /tmp/secret_test.c --llvm-vm 2>/dev/null
          gcc -O2 -o /tmp/secret_test /tmp/secret_test.c 2>/dev/null
          /tmp/secret_test > /tmp/vm_out.txt 2>&1
          grep -q "x=3" /tmp/vm_out.txt || exit 1
          strip /tmp/secret_test
          strings /tmp/secret_test | grep -q "test ok" && exit 1 || true
